name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validate pull requests too: the build job runs, the deploy job does not.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish so a
# half-uploaded artifact is never published.
concurrency:
  # Per-ref so a PR build never queues behind (or cancels) a main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job opts into what it needs. Pull requests from
# forks get a read-only token and no secrets regardless.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages provisions the Pages site through the API on first run.
      pages: write
    steps:
      # Actions are pinned to commit SHAs so a re-pointed tag cannot swap the
      # code that runs with our secrets. Update the SHA and comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # Not --frozen-lockfile: the committed lockfile is written by a canary
      # bun, and stable bun re-serializes it as changed. Every direct dependency
      # in package.json is an exact version, so resolution stays deterministic.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:run

      - name: Build static site
        run: bun run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          # Without this, writes broadcast unprotected over the public RPCs.
          NEXT_PUBLIC_BLINK_API_KEY: ${{ secrets.NEXT_PUBLIC_BLINK_API_KEY }}

      # Jekyll would strip the _next/ directory. public/.nojekyll covers this
      # too; this is belt-and-braces in case the file is ever dropped.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # enablement provisions the Pages site on the first run.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
